<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proyegen S.A.C. | Nuestros Proyectos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
}

header {
    background: white;
    text-align: center;
    padding: 25px 20px 15px;
    border-bottom: 1px solid #ddd;
}

.logo img {
    width: 210px;
    height: auto;
    object-fit: contain;
}

.logo p {
    margin: 8px 0 0;
    font-size: 16px;
    color: #555;
}

.contenedor {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
}

h1 {
    text-align: center;
    margin-bottom: 40px;
    font-size: 34px;
}

.proyecto {
    background: white;
    padding: 30px;
    margin-bottom: 50px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.proyecto h2 {
    margin-top: 0;
    font-size: 28px;
}

.proyecto h3 {
    margin-top: 35px;
    font-size: 21px;
    border-bottom: 2px solid #ddd;
    padding-bottom: 8px;
}

.proyecto .subtitulo-proyecto {
    margin-top: 15px;
    font-size: 23px;
    color: #8a5a00;
    border-bottom: none;
    padding-bottom: 0;
}
.galeria {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.galeria img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    border-radius: 8px;
    display: block;
}

.proceso {
    background: #f7f7f7;
    padding: 20px;
    border-radius: 8px;
}

.boton {
    display: block;
    width: fit-content;
    margin: 20px auto 0;
    padding: 12px 25px;
    background: #333;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

@media (max-width: 800px) {
    .galeria {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {
    .galeria {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 28px;
    }

    .proyecto {
        padding: 20px;
    }
}
</style>
</head>

<body>
